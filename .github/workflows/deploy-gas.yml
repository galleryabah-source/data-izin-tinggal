name: Deploy Google Apps Script

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Canonical Apps Script deployment target. This is a public deployment identifier,
# not a credential; credentials remain in GitHub Secrets.
env:
  APPS_SCRIPT_DEPLOYMENT_ID: "AKfycbzwhcpZWp8LhyidPFsvqwBQ6ZrgXjEB60NkyNmaQYsiewsvm9uZ_pwPdrG5xZINF2NK"

concurrency:
  group: deploy-gas-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm install -g @google/clasp

      - name: Configure clasp credentials
        working-directory: gas
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        run: |
          test -n "$CLASPRC_JSON"
          test -n "$APPS_SCRIPT_ID"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '%s' "{\"scriptId\":\"$APPS_SCRIPT_ID\"}" > .clasp.json

      - name: Push Apps Script source
        working-directory: gas
        run: clasp push --force

      - name: Create immutable Apps Script version
        working-directory: gas
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          VERSION="$(clasp version "GitHub $GITHUB_SHA" | tail -n 1 | tr -cd '0-9')"
          test -n "$VERSION"
          echo "APPS_SCRIPT_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Deploy Apps Script version
        working-directory: gas
        env:
          APPS_SCRIPT_DEPLOYMENT_ID: ${{ env.APPS_SCRIPT_DEPLOYMENT_ID }}
        run: clasp deploy --deploymentId "$APPS_SCRIPT_DEPLOYMENT_ID" --versionNumber "$APPS_SCRIPT_VERSION" --description "GitHub $GITHUB_SHA"
