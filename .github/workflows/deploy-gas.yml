name: Deploy Google Apps Script

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test --if-present
      - run: npm run lint --if-present

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install -g @google/clasp
      - name: Configure clasp
        run: |
          mkdir -p "$HOME/.config/clasp"
          printf '%s' '${{ secrets.CLASPRC_JSON }}' > "$HOME/.config/clasp/.clasprc.json"
      - name: Push Apps Script source
        working-directory: gas
        run: clasp push --force
      - name: Create deployment
        working-directory: gas
        run: clasp deploy -d "GitHub ${GITHUB_SHA}"