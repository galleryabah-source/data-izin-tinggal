name: Deploy Google Apps Script

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @google/clasp
      - name: Configure clasp
        working-directory: gas
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        run: |
          mkdir -p "$HOME/.config/clasp"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.config/clasp/.clasprc.json"
          printf '%s' "{\"scriptId\":\"$APPS_SCRIPT_ID\",\"rootDir\":\"gas\"}" > .clasp.json
      - name: Push Apps Script source
        working-directory: gas
        run: clasp push --force
      - name: Deploy Apps Script
        working-directory: gas
        run: clasp deploy -d "GitHub $GITHUB_SHA"