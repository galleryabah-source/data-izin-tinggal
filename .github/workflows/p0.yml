name: P0 Foundation

on:
  push:
    branches: ["main", "dasmon-imigrasi-*"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node --version
      - run: npm --version
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
