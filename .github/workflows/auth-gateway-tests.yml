name: Auth Gateway Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "auth-gateway/**"
      - ".github/workflows/auth-gateway-tests.yml"
  push:
    branches: [main]
    paths:
      - "auth-gateway/**"
      - ".github/workflows/auth-gateway-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: auth-gateway
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm test
