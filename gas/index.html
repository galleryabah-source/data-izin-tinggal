<!doctype html>
<html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f6f8;color:#17202a}header{background:#17365d;color:white;padding:18px 24px}main{max-width:1100px;margin:24px auto;padding:0 16px}.card{background:white;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px #0001}textarea{width:100%;min-height:180px;box-sizing:border-box}button{padding:10px 16px;border:0;border-radius:8px;cursor:pointer}.primary{background:#17365d;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.metric{font-size:30px;font-weight:700}.muted{color:#667085}.error{color:#b42318}.ok{color:#067647}table{border-collapse:collapse;width:100%}td,th{padding:8px;border-bottom:1px solid #eee;text-align:left}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:16px}.filters label{font-weight:600;font-size:13px}.filters select{width:100%;padding:9px;border:1px solid #d0d5dd;border-radius:8px;background:#fff;margin-top:6px}.filter-actions{display:flex;gap:8px;align-items:end}.secondary{background:#eef2f6;color:#17202a}</style></head><body><header><strong>Data Izin Tinggal</strong><div id="user" class="muted"></div></header><main>
<div id="status" class="card">Memuat...</div>
<section class="grid"><div class="card"><div class="muted">Total Records</div><div id="total" class="metric">-</div></div><div class="card"><div class="muted">Dataset</div><div id="datasets" class="metric">-</div></div><div class="card"><div class="muted">Total Layanan</div><div id="grandTotal" class="metric">-</div></div></section>
<section class="card"><h2>Dashboard Layanan Izin Tinggal</h2>
<div class="filters">
  <label>Periode<select id="periodFilter" onchange="refreshDashboard()"><option value="">Semua Periode</option></select></label>
  <label>Kantor Imigrasi<select id="officeFilter" onchange="refreshDashboard()"><option value="">Semua Kantor</option></select></label>
  <div class="filter-actions"><button class="secondary" onclick="resetFilters()">Reset Filter</button></div>
</div>
<div id="dashboard">Memuat ringkasan...</div></section>
<section class="card"><h2>Import Data</h2><p class="muted">Paste tabel dari spreadsheet. Sistem akan mendeteksi header dan schema.</p><textarea id="paste" placeholder="Paste tabel di sini..."></textarea><p><button class="primary" onclick="preview()">Preview</button> <button onclick="commit()">Import</button></p><div id="result"></div></section>
<section class="card"><h2>Dataset Registry</h2><div id="registry">-</div></section>
</main><script>
function call(fn,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(e))[fn](...args));}
async function boot(){try{const b=await call('getBootstrap');if(!b.user.authenticated){document.getElementById('status').innerHTML='<b>Akses belum terdaftar.</b> Pastikan akun Google Anda ada di sheet USERS.';return;}document.getElementById('user').textContent=b.user.displayName+' · '+b.user.role;document.getElementById('status').innerHTML='<span class="ok">Authenticated</span>';refresh();}catch(e){document.getElementById('status').innerHTML='<span class="error">'+e.message+'</span>';}}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function label(k){return ({bvk:'BVK',voa:'VOA',itk:'ITK',itk_peralihan:'ITK Peralihan',itas:'ITAS',itap:'ITAP',itkt:'ITKT',alih_status_itk_ke_itas:'Alih Status ITK → ITAS',alih_status_itas_ke_itap:'Alih Status ITAS → ITAP',abg:'ABG',epo:'EPO',imk:'IMK',skim:'SKIM'})[k]||k;}
function getFilters(){return {
  periode:document.getElementById('periodFilter').value,
  kantor_imigrasi:document.getElementById('officeFilter').value
};}
function populateFilters(r){
  const p=document.getElementById('periodFilter'),o=document.getElementById('officeFilter');
  const selectedP=r.filters.periode,selectedO=r.filters.kantor_imigrasi;
  p.innerHTML='<option value="">Semua Periode</option>'+r.filters.availablePeriods.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('');
  o.innerHTML='<option value="">Semua Kantor</option>'+r.filters.availableOffices.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('');
  p.value=selectedP;o.value=selectedO;
}
function resetFilters(){document.getElementById('periodFilter').value='';document.getElementById('officeFilter').value='';refreshDashboard();}
async function refreshDashboard(){
  try{
    const r=await call('getResidencePermitDashboard',getFilters());
    populateFilters(r);
    document.getElementById('total').textContent=r.rowCount;\n    document.getElementById('grandTotal').textContent=r.grandTotal.toLocaleString('id-ID');
    const monthly='<h3>Tren Bulanan</h3><table><tr><th>Periode</th><th>Rows</th><th>Total Layanan</th></tr>'+r.monthly.map(x=>'<tr><td>'+esc(x.periode)+'</td><td>'+x.rows+'</td><td>'+x.total.toLocaleString('id-ID')+'</td></tr>').join('')+'</table>';
    const offices='<h3>Per Kantor Imigrasi</h3><table><tr><th>Kantor</th><th>Rows</th><th>Total Layanan</th></tr>'+r.offices.map(x=>'<tr><td>'+esc(x.kantor_imigrasi)+'</td><td>'+x.rows+'</td><td>'+x.total.toLocaleString('id-ID')+'</td></tr>').join('')+'</table>';
    const services='<h3>Per Jenis Layanan</h3><table><tr><th>Layanan</th><th>Total</th></tr>'+r.services.map(x=>'<tr><td>'+esc(label(x.key))+'</td><td>'+x.total.toLocaleString('id-ID')+'</td></tr>').join('')+'</table>';
    document.getElementById('dashboard').innerHTML=monthly+offices+services;
  }catch(e){document.getElementById('dashboard').innerHTML='<span class="error">'+esc(e.message)+'</span>';}
}
async function refresh(){
  const d=await call('getDashboardSummary');
  document.getElementById('total').textContent=d.totalRecords;
  document.getElementById('datasets').textContent=d.datasets.length;
  document.getElementById('registry').innerHTML='<table><tr><th>Dataset</th><th>Rows</th><th>Columns</th></tr>'+d.datasets.map(x=>'<tr><td>'+esc(x.datasetKey)+'</td><td>'+x.rowCount+'</td><td>'+x.columns.join(', ')+'</td></tr>').join('')+'</table>';
  await refreshDashboard();
}
async function preview(){try{const r=await call('previewImport',document.getElementById('paste').value);document.getElementById('result').innerHTML='<b>Preview:</b> '+r.validRows+' valid, '+r.rejectedRows+' rejected.<br>Dataset: '+r.dataset.datasetKey;}catch(e){document.getElementById('result').innerHTML='<span class="error">'+e.message+'</span>';}}
async function commit(){try{const r=await call('commitImport',document.getElementById('paste').value);document.getElementById('result').innerHTML='<span class="ok">Import berhasil. Batch '+r.batchId+' · '+r.inserted+' rows.</span>';await refresh();}catch(e){document.getElementById('result').innerHTML='<span class="error">'+e.message+'</span>';}}
boot();
</script></body></html>
